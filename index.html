<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator</title>
<style>
  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --display-bg: #0f172a;
    --accent: #7c3aed;
    --accent-hover: #9333ea;
    --op-bg: #374151;
    --op-hover: #4b5563;
    --num-bg: #1f2937;
    --num-hover: #2d3748;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --equal-bg: linear-gradient(135deg,#7c3aed,#c026d3);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #24243e, #0f0f1e 70%);
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    padding: 16px;
  }

  .calculator {
    background: var(--panel);
    border-radius: 20px;
    padding: 20px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
  }

  .display {
    background: var(--display-bg);
    border-radius: 14px;
    padding: 20px 16px;
    margin-bottom: 16px;
    text-align: right;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }

  .history {
    color: var(--muted);
    font-size: 14px;
    min-height: 18px;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }

  .current {
    color: var(--text);
    font-size: 2.2rem;
    font-weight: 500;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .current::-webkit-scrollbar { display: none; }

  .mode-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding: 0 2px;
  }

  .mode-toggle {
    display: flex;
    gap: 6px;
  }

  .mode-btn {
    background: var(--op-bg);
    color: var(--muted);
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .mode-btn.active {
    background: var(--accent);
    color: #fff;
  }

  .indicator {
    font-size: 12px;
    color: var(--muted);
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  button.btn {
    border: none;
    border-radius: 12px;
    padding: 14px 0;
    font-size: 16px;
    cursor: pointer;
    color: var(--text);
    background: var(--num-bg);
    transition: transform 0.06s ease, background 0.15s ease;
    user-select: none;
  }

  button.btn:hover { background: var(--num-hover); }
  button.btn:active { transform: scale(0.94); }

  button.btn.op {
    background: var(--op-bg);
    color: #d1d5db;
  }
  button.btn.op:hover { background: var(--op-hover); }

  button.btn.func {
    background: #2c2440;
    color: #c4b5fd;
    font-size: 14px;
  }
  button.btn.func:hover { background: #3b2f5c; }

  button.btn.accent {
    background: var(--accent);
    color: #fff;
  }
  button.btn.accent:hover { background: var(--accent-hover); }

  button.btn.equal {
    background: var(--equal-bg);
    color: #fff;
    grid-column: span 2;
    font-weight: 600;
    font-size: 18px;
  }

  button.btn.wide {
    grid-column: span 2;
  }

  button.btn.danger {
    background: #7f1d1d;
    color: #fecaca;
  }
  button.btn.danger:hover { background: #991b1b; }

  @media (max-width: 380px) {
    .current { font-size: 1.8rem; }
    button.btn { padding: 12px 0; font-size: 14px; }
  }
</style>
</head>
<body>

<div class="calculator">
  <div class="mode-row">
    <div class="mode-toggle">
      <button class="mode-btn active" id="degBtn" onclick="setAngleMode('deg')">DEG</button>
      <button class="mode-btn" id="radBtn" onclick="setAngleMode('rad')">RAD</button>
    </div>
    <div class="indicator" id="memIndicator"></div>
  </div>

  <div class="display">
    <div class="history" id="history">&nbsp;</div>
    <div class="current" id="current">0</div>
  </div>

  <div class="buttons">
    <!-- Row 1: scientific functions -->
    <button class="btn func" onclick="applyFunc('sin')">sin</button>
    <button class="btn func" onclick="applyFunc('cos')">cos</button>
    <button class="btn func" onclick="applyFunc('tan')">tan</button>
    <button class="btn func" onclick="applyFunc('ln')">ln</button>
    <button class="btn func" onclick="applyFunc('log')">log</button>

    <!-- Row 2: inverse trig + more -->
    <button class="btn func" onclick="applyFunc('asin')">sin⁻¹</button>
    <button class="btn func" onclick="applyFunc('acos')">cos⁻¹</button>
    <button class="btn func" onclick="applyFunc('atan')">tan⁻¹</button>
    <button class="btn func" onclick="applyFunc('sqrt')">√</button>
    <button class="btn func" onclick="applyFunc('cbrt')">∛</button>

    <!-- Row 3: powers, constants, memory -->
    <button class="btn func" onclick="applyFunc('square')">x²</button>
    <button class="btn func" onclick="inputOperator('^')">xʸ</button>
    <button class="btn func" onclick="applyFunc('exp')">eˣ</button>
    <button class="btn func" onclick="inputConst('pi')">π</button>
    <button class="btn func" onclick="inputConst('e')">e</button>

    <!-- Row 4: memory + clear -->
    <button class="btn op" onclick="memoryAction('mc')">MC</button>
    <button class="btn op" onclick="memoryAction('mr')">MR</button>
    <button class="btn op" onclick="memoryAction('m+')">M+</button>
    <button class="btn op" onclick="memoryAction('m-')">M-</button>
    <button class="btn danger" onclick="clearAll()">AC</button>

    <!-- Row 5 -->
    <button class="btn op" onclick="backspace()">⌫</button>
    <button class="btn func" onclick="applyFunc('fact')">n!</button>
    <button class="btn func" onclick="applyFunc('inv')">1/x</button>
    <button class="btn func" onclick="applyFunc('negate')">±</button>
    <button class="btn op" onclick="inputOperator('/')">÷</button>

    <!-- Row 6: 7 8 9 x -->
    <button class="btn" onclick="inputDigit('7')">7</button>
    <button class="btn" onclick="inputDigit('8')">8</button>
    <button class="btn" onclick="inputDigit('9')">9</button>
    <button class="btn op" onclick="inputOperator('*')">×</button>
    <button class="btn op" onclick="inputBracket()">( )</button>

    <!-- Row 7: 4 5 6 - -->
    <button class="btn" onclick="inputDigit('4')">4</button>
    <button class="btn" onclick="inputDigit('5')">5</button>
    <button class="btn" onclick="inputDigit('6')">6</button>
    <button class="btn op" onclick="inputOperator('-')">−</button>
    <button class="btn op" onclick="applyFunc('percent')">%</button>

    <!-- Row 8: 1 2 3 + -->
    <button class="btn" onclick="inputDigit('1')">1</button>
    <button class="btn" onclick="inputDigit('2')">2</button>
    <button class="btn" onclick="inputDigit('3')">3</button>
    <button class="btn op" onclick="inputOperator('+')">+</button>
    <button class="btn accent equal" style="grid-row: span 2;" onclick="calculate()">=</button>

    <!-- Row 9: 0 . -->
    <button class="btn wide" onclick="inputDigit('0')">0</button>
    <button class="btn" onclick="inputDigit('.')">.</button>
    <button class="btn op" onclick="inputOperator('EE')">EXP</button>
  </div>
</div>

<script>
  let expression = '';
  let currentDisplay = '0';
  let angleMode = 'deg';
  let memory = 0;
  let justCalculated = false;

  const currentEl = document.getElementById('current');
  const historyEl = document.getElementById('history');
  const memIndicator = document.getElementById('memIndicator');

  function updateDisplay() {
    currentEl.textContent = currentDisplay || '0';
    historyEl.textContent = expression || '\u00A0';
    memIndicator.textContent = memory !== 0 ? 'M' : '';
  }

  function setAngleMode(mode) {
    angleMode = mode;
    document.getElementById('degBtn').classList.toggle('active', mode === 'deg');
    document.getElementById('radBtn').classList.toggle('active', mode === 'rad');
  }

  function inputDigit(d) {
    if (justCalculated) {
      currentDisplay = '';
      expression = '';
      justCalculated = false;
    }
    if (d === '.' && currentDisplay.includes('.')) return;
    if (currentDisplay === '0' && d !== '.') {
      currentDisplay = d;
    } else {
      currentDisplay += d;
    }
    updateDisplay();
  }

  function inputOperator(op) {
    justCalculated = false;
    if (op === 'EE') {
      currentDisplay += 'e';
      updateDisplay();
      return;
    }
    const symbolMap = { '+': '+', '-': '-', '*': '×', '/': '÷', '^': '^' };
    expression += currentDisplay + ' ' + symbolMap[op] + ' ';
    currentDisplay = '';
    updateDisplay();
  }

  function inputConst(name) {
    if (justCalculated) {
      currentDisplay = '';
      expression = '';
      justCalculated = false;
    }
    if (name === 'pi') currentDisplay = String(Math.PI);
    if (name === 'e') currentDisplay = String(Math.E);
    updateDisplay();
  }

  let bracketOpen = false;
  function inputBracket() {
    if (currentDisplay === '' || currentDisplay === '0') {
      expression += '(';
      bracketOpen = true;
    } else {
      expression += currentDisplay + ' × (';
      currentDisplay = '';
      bracketOpen = true;
    }
    updateDisplay();
  }

  function toRadians(val) {
    return angleMode === 'deg' ? (val * Math.PI / 180) : val;
  }
  function fromRadians(val) {
    return angleMode === 'deg' ? (val * 180 / Math.PI) : val;
  }

  function factorial(n) {
    if (n < 0 || !Number.isInteger(n)) return NaN;
    if (n === 0 || n === 1) return 1;
    let result = 1;
    for (let i = 2; i <= n; i++) result *= i;
    return result;
  }

  function applyFunc(fn) {
    let val = parseFloat(currentDisplay || '0');
    if (isNaN(val)) return;
    let result;

    switch (fn) {
      case 'sin': result = Math.sin(toRadians(val)); break;
      case 'cos': result = Math.cos(toRadians(val)); break;
      case 'tan': result = Math.tan(toRadians(val)); break;
      case 'asin': result = fromRadians(Math.asin(val)); break;
      case 'acos': result = fromRadians(Math.acos(val)); break;
      case 'atan': result = fromRadians(Math.atan(val)); break;
      case 'ln': result = Math.log(val); break;
      case 'log': result = Math.log10(val); break;
      case 'sqrt': result = Math.sqrt(val); break;
      case 'cbrt': result = Math.cbrt(val); break;
      case 'square': result = val * val; break;
      case 'exp': result = Math.exp(val); break;
      case 'fact': result = factorial(val); break;
      case 'inv': result = 1 / val; break;
      case 'negate': result = val * -1; break;
      case 'percent': result = val / 100; break;
      default: result = val;
    }

    currentDisplay = formatResult(result);
    updateDisplay();
  }

  function formatResult(num) {
    if (isNaN(num)) return 'Error';
    if (!isFinite(num)) return 'Error';
    // Round to avoid floating point noise, keep reasonable precision
    let rounded = Math.round(num * 1e10) / 1e10;
    return String(rounded);
  }

  function memoryAction(action) {
    const val = parseFloat(currentDisplay || '0');
    switch (action) {
      case 'mc': memory = 0; break;
      case 'mr':
        currentDisplay = String(memory);
        justCalculated = false;
        break;
      case 'm+': memory += isNaN(val) ? 0 : val; break;
      case 'm-': memory -= isNaN(val) ? 0 : val; break;
    }
    updateDisplay();
  }

  function backspace() {
    currentDisplay = currentDisplay.slice(0, -1);
    updateDisplay();
  }

  function clearAll() {
    expression = '';
    currentDisplay = '0';
    justCalculated = false;
    bracketOpen = false;
    updateDisplay();
  }

  function calculate() {
    let fullExpr = expression + currentDisplay;
    if (!fullExpr.trim()) return;

    // Balance any open parentheses
    let openCount = (fullExpr.match(/\(/g) || []).length;
    let closeCount = (fullExpr.match(/\)/g) || []).length;
    for (let i = 0; i < openCount - closeCount; i++) fullExpr += ')';

    // Convert display symbols to JS operators
    let evalExpr = fullExpr
      .replace(/×/g, '*')
      .replace(/÷/g, '/')
      .replace(/\^/g, '**');

    try {
      // Safe-ish eval restricted to math expressions
      if (!/^[0-9+\-*/().\s%eE^]*$/.test(evalExpr.replace(/\*\*/g, '^'))) {
        throw new Error('Invalid characters');
      }
      // eslint-disable-next-line no-eval
      let result = Function('"use strict"; return (' + evalExpr + ')')();
      currentDisplay = formatResult(result);
      expression = fullExpr + ' =';
      justCalculated = true;
    } catch (e) {
      currentDisplay = 'Error';
      justCalculated = true;
    }
    updateDisplay();
  }

  // Keyboard support
  document.addEventListener('keydown', (e) => {
    const key = e.key;
    if (/[0-9]/.test(key)) inputDigit(key);
    else if (key === '.') inputDigit('.');
    else if (key === '+') inputOperator('+');
    else if (key === '-') inputOperator('-');
    else if (key === '*') inputOperator('*');
    else if (key === '/') { e.preventDefault(); inputOperator('/'); }
    else if (key === 'Enter' || key === '=') { e.preventDefault(); calculate(); }
    else if (key === 'Backspace') backspace();
    else if (key === 'Escape') clearAll();
    else if (key === '(' || key === ')') inputBracket();
    else if (key === '%') applyFunc('percent');
    else if (key === '^') inputOperator('^');
  });

  updateDisplay();
</script>

</body>
</html>
